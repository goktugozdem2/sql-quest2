name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --run

      - name: Build
        run: npm run build

      - name: Validate build artifacts
        run: npm run build:validate

      # Gzip budgets for public/app.js, data.js and styles.css, measured on
      # the fresh build above (.size-limit.json; set 2026-11-24 at +3%).
      # A PR that grows a bundle past its limit fails here.
      - name: Bundle size budget
        run: npm run size
