# The smoke bot (docs/plans/smoke-bot-rollback-2026-09-21.md, backlog #1).
# Daily at 07:00 UTC, by hand, and after every push to main that touches the
# deployed surface. Four checks against https://sqlquest.app, all hermetic
# (nothing they do writes a row or an event): interactive-within-10-s,
# scripts/smoke-test.js, three pro-mock scenarios, and the 24 h slow-query
# read. On failure: one issue comment + one Resend mail, deduplicated per
# check per day (scripts/smoke/alert.mjs). Rollback ONLY for the
# frontend_dead class, only on a push that touched no supabase/** or api/**,
# and only when VERCEL_TOKEN is set (scripts/smoke/vercel-rollback.mjs).
#
# Secrets: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY, REPORT_TO
# (exist); VERCEL_TOKEN (project-scoped), VERCEL_PROJECT_ID, VERCEL_ORG_ID
# (the founder adds; without the token the rollback job logs and skips).
name: Smoke

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'vercel.json'
      - 'api/**'

permissions:
  contents: read
  issues: write

concurrency:
  group: smoke
  cancel-in-progress: false

env:
  SMOKE_URL: https://sqlquest.app

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      failed: ${{ steps.verdict.outputs.failed }}
      frontend_dead: ${{ steps.verdict.outputs.frontend_dead }}
      backend_touched: ${{ steps.paths.outputs.backend_touched }}
      deploy_live: ${{ steps.deploy.outputs.live }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # A push that carried a schema or edge-function change is never rolled
      # back by the bot — the front end may depend on it (plan §3).
      - name: Did this push touch supabase/ or api/
        id: paths
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "backend_touched=unknown" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            changed=$(git diff --name-only "$BEFORE" "$AFTER")
          else
            changed=$(git show --pretty=format: --name-only "$AFTER")
          fi
          echo "$changed"
          if echo "$changed" | grep -Eq '^(supabase/|api/)'; then
            echo "backend_touched=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend_touched=false" >> "$GITHUB_OUTPUT"
          fi

      # After a push, wait for Vercel: the committed public/app.html carries
      # app.js?v=<hash>; the deploy is live when the served page and the
      # served app.js carry the same hash. 10-minute ceiling.
      - name: Wait for the deploy to be live
        id: deploy
        if: github.event_name == 'push'
        run: |
          if node scripts/smoke/wait-for-deploy.mjs "$SMOKE_URL"; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Find Chrome
        id: chrome
        run: |
          if command -v google-chrome >/dev/null; then echo "CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV";
          else
            out=$(npx --yes @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome")
            echo "CHROME=${out##* }" >> "$GITHUB_ENV"
          fi

      - name: Interactive within 10 s
        id: interactive
        continue-on-error: true
        run: node scripts/smoke/interactive.mjs "$SMOKE_URL"

      # ADVISORY until the battery is green against the current build: six of
      # its 27 checks are stale (measured 2026-09-29 on the live site AND on a
      # local build of the same commit). Its result is recorded and shown in
      # every alert body, but it does not fail the run or mail on its own.
      # Remove SMOKE_BATTERY_ADVISORY once it passes 27/27.
      - name: Smoke battery (scripts/smoke-test.js)
        id: battery
        continue-on-error: true
        env:
          SMOKE_HERMETIC: '1'
          SMOKE_BATTERY_ADVISORY: '1'
        run: |
          set +e
          node scripts/smoke-test.js "$SMOKE_URL" 2>&1 | tee smoke-battery.log
          code=${PIPESTATUS[0]}
          node scripts/smoke/record.mjs smoke-battery "$code" smoke-battery.log
          exit "$code"

      - name: Pro-mock scenarios (hermetic)
        id: promock
        continue-on-error: true
        run: node scripts/smoke/pro-mock-checks.mjs "$SMOKE_URL"

      - name: Slow queries, last 24 h
        id: db
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/smoke/db-slow-queries.mjs

      - name: Verdict
        id: verdict
        run: node scripts/smoke/record.mjs --verdict

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-out-${{ github.run_id }}
          path: |
            smoke-out/
            smoke-battery.log
            scripts/qa/out/*.png
          if-no-files-found: ignore
          retention-days: 14

  # Narrow and gated (plan §3): the failing class must be frontend_dead, the
  # triggering push must have touched no supabase/** or api/**, and the
  # VERCEL_TOKEN secret must be set. A schedule or manual run has no
  # triggering commit, so it never rolls back. Never for a business check.
  rollback:
    needs: smoke
    if: always() && needs.smoke.result == 'failure' && needs.smoke.outputs.frontend_dead == 'true' && needs.smoke.outputs.backend_touched == 'false' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      result: ${{ steps.roll.outputs.result }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vercel instant rollback to the previous production deployment
        id: roll
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "rollback skipped: VERCEL_TOKEN not set"
            echo 'result={"skipped":"VERCEL_TOKEN not set"}' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/smoke/vercel-rollback.mjs

  alert:
    needs: [smoke, rollback]
    if: always() && needs.smoke.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: smoke-out-${{ github.run_id }}
      - name: One mail, one issue comment, deduplicated per check per day
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ROLLBACK_RESULT: ${{ needs.rollback.outputs.result }}
          DEPLOY_LIVE: ${{ needs.smoke.outputs.deploy_live }}
        run: node scripts/smoke/alert.mjs
