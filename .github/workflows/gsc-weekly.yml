# Weekly Search Console jobs, Mondays:
#   05:00 UTC  URL Inspection for every sitemap URL → gsc_index_status (scripts/gsc/inspect.mjs)
#   07:00 UTC  the weekly report from gsc_daily, mailed (scripts/gsc/report.mjs)
# Secrets: GSC_SA_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY; for the mail
# also RESEND_API_KEY and REPORT_TO. Keys are environment variables only.
name: GSC weekly

on:
  schedule:
    - cron: '0 5 * * 1'
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      job:
        description: 'Which job'
        type: choice
        options: [inspect, report, both]
        default: both

permissions:
  contents: read
  issues: write

jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' && inputs.job != 'report' || github.event.schedule == '0 5 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect sitemap URLs
        env:
          GSC_SA_KEY: ${{ secrets.GSC_SA_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/gsc/inspect.mjs
      - name: Report the failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/gsc/notify-failure.sh "GSC index inspection failed" "$RUN_URL"

  report:
    if: github.event_name == 'workflow_dispatch' && inputs.job != 'inspect' || github.event.schedule == '0 7 * * 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Weekly report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
        run: node scripts/gsc/report.mjs
      - name: Report the failure as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/gsc/notify-failure.sh "GSC weekly report failed" "$RUN_URL"
