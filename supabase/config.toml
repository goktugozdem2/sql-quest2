# Supabase project config — per-function auth overrides.
#
# By default, Supabase Edge Functions require a JWT. That's wrong for two
# of ours:
#
#   - og-profile returns an OG image. Social scrapers (Twitter, LinkedIn,
#     Discord, Slack, Notion) can NEVER pass auth headers. Must be public.
#
#   - publish-profile is called by the client with the anon key, and the
#     function enforces ownership via ownership_hash. JWT verify adds no
#     security on top of that and breaks the browser fetch because our
#     client isn't using Supabase Auth (we have our own user system).
#
# Keep JWT verification ON for any new function that handles secrets.

[functions.og-profile]
verify_jwt = false

[functions.publish-profile]
verify_jwt = false

# ── Mirrors production (read 2026-09-27 via list_edge_functions) ──────────
# 2026-09-27: `supabase functions deploy activated-note` without
# --no-verify-jwt switched the gateway's JWT check back ON; SENDER_SECRET is
# not a JWT, so every founder run and the trial-reminder cron got
# "Invalid JWT" for two minutes. These entries make a plain deploy keep each
# function as it runs in production. The senders do their own caller check
# ("service role required"); the webhooks check signatures; account-login /
# account-password and email-unsubscribe serve people without a Supabase JWT.
# tests/function-jwt-config.test.js binds the senders to this file.
[functions.welcome-back]
verify_jwt = false

[functions.streak-reminder]
verify_jwt = false

[functions.skill-decay]
verify_jwt = false

[functions.stripe-webhook]
verify_jwt = false

[functions.capture-email]
