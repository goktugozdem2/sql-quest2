<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SQL Quest KPIs</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1117;
      --panel: #171b24;
      --panel-2: #1f2530;
      --text: #f4f2ec;
      --muted: #9aa3b2;
      --line: #303746;
      --green: #55d38a;
      --cyan: #56c7d8;
      --yellow: #f3c969;
      --red: #ff7b72;
      --purple: #b89cff;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--line);
    }

    h1, h2, h3, p { margin: 0; }
    h1 { font-size: 28px; line-height: 1.15; }
    h2 { margin: 28px 0 12px; font-size: 16px; color: var(--muted); text-transform: uppercase; }
    h3 { font-size: 13px; color: var(--muted); font-weight: 700; }
    code { color: var(--cyan); }

    .meta {
      margin-top: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: var(--panel-2);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      gap: 12px;
    }

    .metrics {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }

    .two {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .tile, .section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 16px;
    }

    .value {
      margin-top: 8px;
      font-size: 30px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 0;
    }

    .sub {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .good { color: var(--green); }
    .warn { color: var(--yellow); }
    .bad { color: var(--red); }
    .info { color: var(--cyan); }
    .purple { color: var(--purple); }

    .gate {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .bar {
      overflow: hidden;
      height: 8px;
      margin-top: 12px;
      border-radius: 999px;
      background: #0b0d12;
    }

    .bar > span {
      display: block;
      height: 100%;
      width: 0;
      background: var(--cyan);
    }

    .rows {
      display: grid;
      gap: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(48, 55, 70, 0.7);
      font-size: 14px;
    }

    .row:last-child { border-bottom: 0; }
    .row span:first-child { color: var(--muted); }
    .row span:last-child { font-weight: 800; text-align: right; }

    .actions {
      margin: 0;
      padding: 0;
      list-style: none;
      display: grid;
      gap: 10px;
    }

    .actions li {
      border-left: 3px solid var(--yellow);
      padding: 10px 12px;
      background: rgba(243, 201, 105, 0.08);
      color: #f7e6b8;
      font-size: 14px;
      line-height: 1.45;
    }

    .empty {
      padding: 18px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: rgba(31, 37, 48, 0.55);
      line-height: 1.55;
    }

    @media (max-width: 860px) {
      header { flex-direction: column; }
      .metrics, .two { grid-template-columns: 1fr; }
      .value { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>SQL Quest KPIs</h1>
        <p class="meta" id="generated">Loading local metrics snapshot...</p>
      </div>
      <a class="button" href="/app.html">Open App</a>
    </header>

    <div id="error" class="empty" style="display:none; margin-top:20px;">
      No KPI snapshot found. Generate it with
      <code>SQ_SUPABASE_SERVICE_ROLE_KEY=&lt;key&gt; npm run metrics:kpis</code>,
      then refresh this page.
    </div>

    <section id="dashboard" style="display:none;">
      <h2>Topline</h2>
      <div class="grid metrics" id="topline"></div>

      <h2>Lesson 1 Gate</h2>
      <div class="grid two">
        <div class="section">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
            <h3>Expansion Status</h3>
            <span class="gate" id="gate-status">-</span>
          </div>
          <div class="value" id="lesson-rate">-</div>
          <p class="sub" id="lesson-detail">-</p>
          <div class="bar"><span id="lesson-bar"></span></div>
        </div>
        <div class="section rows" id="lesson-rows"></div>
      </div>

      <h2>Funnel Health</h2>
      <div class="grid two">
        <div class="section rows" id="monetization"></div>
        <div class="section rows" id="referrals"></div>
      </div>

      <h2>Next Actions</h2>
      <ul class="actions" id="actions"></ul>
    </section>
  </main>

  <script>
    const fmt = new Intl.NumberFormat('en-US');
    const pct = value => `${Number(value || 0).toFixed(1).replace(/\.0$/, '')}%`;
    const num = value => fmt.format(Number(value || 0));

    function metric(label, value, sub, tone = '') {
      return `<div class="tile"><h3>${label}</h3><div class="value ${tone}">${value}</div><p class="sub">${sub}</p></div>`;
    }

    function row(label, value, tone = '') {
      return `<div class="row"><span>${label}</span><span class="${tone}">${value}</span></div>`;
    }

    function gateTone(status) {
      if (status === 'ready') return 'good';
      if (status === 'blocked') return 'bad';
      return 'warn';
    }

    fetch('/kpis.json', { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error('missing snapshot');
        return response.json();
      })
      .then(data => {
        const acquisition = data.acquisition || {};
        const lesson = data.activation_funnel?.lesson1 || {};
        const gate = data.decision_gates?.lesson1_before_more_lessons || {};
        const monetization = data.monetization || {};
        const referrals = data.referrals || {};
        const targetStarts = Number(gate.target_started_users || data.targets?.min_lesson1_started_users || 30);
        const started = Number(lesson.started_users || 0);
        const status = gate.status || 'unknown';

        document.getElementById('generated').textContent = `Generated ${new Date(data.generated_at).toLocaleString()}`;
        document.getElementById('topline').innerHTML = [
          metric('Users', num(acquisition.users_total), `${num(acquisition.users_30d)} in last 30 days`, 'info'),
          metric('7d Signups', num(acquisition.users_7d), `WoW ${pct(acquisition.signup_wow_pct)}`, acquisition.signup_wow_pct >= 0 ? 'good' : 'bad'),
          metric('Lesson 1 Complete', pct(lesson.start_to_complete_pct), `${num(lesson.completed_users)} of ${num(lesson.started_users)} users`, 'purple'),
          metric('Pro Checkout Rate', pct(monetization.pro_modal_to_checkout_pct), `${num(monetization.pro_checkout_clicks)} clicks from ${num(monetization.pro_modal_shown)} modals`, monetization.pro_modal_to_checkout_pct >= (data.targets?.pro_modal_to_checkout_pct || 8) ? 'good' : 'warn'),
        ].join('');

        const gateEl = document.getElementById('gate-status');
        gateEl.textContent = status;
        gateEl.classList.add(gateTone(status));
        document.getElementById('lesson-rate').textContent = pct(lesson.start_to_complete_pct);
        document.getElementById('lesson-rate').className = `value ${gateTone(status)}`;
        document.getElementById('lesson-detail').textContent = `${num(started)} Lesson 1 starts collected. Target: ${num(targetStarts)} starts before expanding more lessons.`;
        document.getElementById('lesson-bar').style.width = `${Math.min(100, Math.round((started / Math.max(1, targetStarts)) * 100))}%`;

        document.getElementById('lesson-rows').innerHTML = [
          row('Started users', num(lesson.started_users)),
          row('Completed users', num(lesson.completed_users)),
          row('Exercise completions', num(lesson.exercise_completed_events)),
          row('Wrong attempts', num(lesson.wrong_attempt_events)),
          row('Hints used', num(lesson.hint_used_events)),
          row('Review completion', pct(lesson.review_completion_pct)),
        ].join('');

        document.getElementById('monetization').innerHTML = [
          row('Pro modals shown', num(monetization.pro_modal_shown)),
          row('Checkout clicks', num(monetization.pro_checkout_clicks)),
          row('Modal to checkout', pct(monetization.pro_modal_to_checkout_pct), monetization.pro_modal_to_checkout_pct >= (data.targets?.pro_modal_to_checkout_pct || 8) ? 'good' : 'warn'),
          row('Purchases', num(monetization.pro_purchase_completed_events), monetization.pro_purchase_completed_events > 0 ? 'good' : 'warn'),
        ].join('');

        document.getElementById('referrals').innerHTML = [
          row('Referral events', num(referrals.referrals_total)),
          row('Clicks', num(referrals.by_type?.click)),
          row('Signups', num(referrals.by_type?.signup)),
          row('Click to signup', pct(referrals.click_to_signup_pct), referrals.click_to_signup_pct >= (data.targets?.referral_click_to_signup_pct || 10) ? 'good' : 'warn'),
        ].join('');

        document.getElementById('actions').innerHTML = (data.next_actions || [])
          .map(action => `<li>${action}</li>`)
          .join('');

        document.getElementById('dashboard').style.display = '';
      })
      .catch(() => {
        document.getElementById('error').style.display = '';
      });
  </script>
</body>
</html>
